<!-- FRONTEND LAYER-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>OpenSesame</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Link to my CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-body d-flex flex-column">
    <!-- header element -->
    <header class="py-5 text-white bg-dark">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-6">
                    <!-- page header -->
                    <h1 class="display-4 mb-0">OpenSesame</h1>
                </div>
                <div class="col-6 text-end">
                    <img src="../images/magnifying-glass-graphic-clipart.webp" class="img-fluid" width="96" height="96" alt="Magnifying glass">
                </div>
            </div>
        </div>
    </header>
    <!-- main element -->
    <main class="container flex-grow-1 py-5">
        <section class="hero-section w-100 mb-5">
            <div class="hero-content card border-0 bg-transparent text-white mx-auto">
                <div class="card-body text-center">
                    <!-- beginning part of website to open to new tabs -->
                    <h2 class="card-title text-white">What website do you want to visit today?</h2>
                    <a class="btn btn-primary mt-3" href="https://www.google.com" target="_blank" rel="noopener noreferrer">Open Google</a>
                </div>
            </div>
        </section>
        <section class="hero-section w-100 mb-5">
            <div class="hero-content card border-0 bg-transparent text-white mx-auto">
                <div class="card-body text-center">
                    <!-- user information for websites -->
                    <h2 class="card-title text-white">Want to checkout your information?</h2>
                        <article class="skill-card card h-100"> 
                            <div class="card-body d-flex flex-column"> 
                                <h3 class="card-title h5">website name</h3> 
                                <p class="card-text">username/email</p> 
                                <p class="text-text">password</p>  
                                <button class="skill-details-toggle btn btn-outline-success btn-sm mt-3" type="button">Show session details</button> 
                            </div> 
                        </article> 
                </div>
            </div>
        </section>
    </main>
    <!-- footer element -->
    <footer class="mt-auto py-3 text-center text-white bg-dark">
        <p class="mb-0">OpenSesame</p>
    </footer>
    <!-- Link to my JavaScript files -->
    <script src="script.js"></script>
</body>
